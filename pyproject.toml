[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-echo-monitor"
version = "0.4.0"
description = "Traceable CAMUS / EchoNet cardiac segmentation and function baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10"]

[project.optional-dependencies]
model = ["torch>=2.2", "torchvision>=0.17"]
medical = ["SimpleITK>=2.3", "opencv-python-headless>=4.9", "pydicom>=2.4"]
test = ["pytest>=8"]

[project.scripts]
patch-echo = "cardiac.cli:main"

[tool.setuptools.packages.find]
include = ["cardiac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
