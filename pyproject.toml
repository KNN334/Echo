[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-echo-monitor"
version = "0.5.0"
description = "Traceable CAMUS / EchoNet cardiac segmentation and function baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6.0"]

[project.optional-dependencies]
model = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.66"]
medical = ["SimpleITK>=2.3", "opencv-python-headless>=4.9", "pydicom>=2.4"]
test = ["pytest>=8"]

[project.scripts]
echo-prepare = "scripts.prepare_data:cli"
echo-train = "scripts.train:cli"
echo-evaluate = "scripts.evaluate:cli"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.work/pytest"
cache_dir = ".work/pytest_cache"
