[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lv-video-segmentation"
version = "0.7.0"
description = "CAMUS / EchoNet left-ventricle cine segmentation and volume baselines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6.0"]

[project.optional-dependencies]
model = ["torch>=2.2"]
medical = ["SimpleITK>=2.3", "opencv-python-headless>=4.9"]
visualization = ["matplotlib>=3.8"]
test = ["pytest>=8", "torch>=2.2", "matplotlib>=3.8"]

[project.scripts]
lvseg-download-camus = "scripts.download_camus:cli"
lvseg-prepare-camus = "scripts.prepare_camus:cli"
lvseg-prepare-echonet = "scripts.prepare_echonet:main"
lvseg-run-baselines = "scripts.run_baselines:cli"
lvseg-plot-volume-curve = "scripts.plot_volume_curve:cli"
lvseg-export-readme-assets = "scripts.export_readme_assets:main"

[tool.setuptools.packages.find]
include = ["lvseg*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.work/pytest"
cache_dir = ".work/pytest_cache"
