defaults:
  - model: model/deeplabv3_resnet50.yaml
  - data: data/echonet.yaml
  - train: train/baseline.yaml

experiment_type: public_echonet_downstream_baseline

train:
  output: checkpoints/echonet_baseline
  initial_weights: checkpoints/echonet_official.pt

test:
  weights: checkpoints/echonet_baseline/best.pt
  output: runs/echonet_baseline
  device: auto
  cpu_threads: 2
  temporal: false
  quality_gate: false
  normalization: null
  references: null
  manual_landmarks: null
