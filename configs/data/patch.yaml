adapter: patch
dataset: data/processed/patch
split_assignments: configs/patch_splits.json
train_path: data/processed/patch/splits/train.json
val_path: data/processed/patch/splits/val.json
test_path: data/processed/patch/splits/test.json
split_seed: 2026
expected_patients: 3
views: [A4C, A2C, PLAX, PSAX]
preprocessing:
  output_hw: [512, 512]
  intensity_range: [0, 255]
  auto_largest_support: false
  exclude_boxes_xyxy: []
  roi_reviewed: false
