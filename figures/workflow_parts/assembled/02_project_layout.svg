<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="238.553571mm" viewBox="0 0 672 876" version="1.1" role="img" aria-label="项目总图布局规划"><title>项目总图布局规划</title><desc>Editable vector reconstruction. Live labels and vector shapes. Thumbnail paths are quantized tracings, not recovered source data. Research methods draft; not clinical validation.</desc><rect x="0" y="0" width="672" height="876" rx="0" fill="white" stroke="none" stroke-width="0.65" /><text x="12" y="22" font-family="Microsoft YaHei UI" font-size="14.5" text-anchor="start" fill="#20303e" font-weight="700">基于贴片式超声探头的心脏功能参数连续监测与分析</text><text x="12" y="38" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="start" fill="#20303e" font-weight="400">CAMUS 可复现基线  ·  EchoNet 分割迁移  ·  贴片连续监测扩展</text><g id="s-data" data-role="stage"><rect x="4" y="48" width="664" height="142" rx="0" fill="#fffcf8" stroke="#b59c7d" stroke-width="0.65" /><text x="13" y="64" font-family="Microsoft YaHei UI" font-size="12.2" text-anchor="start" fill="#20303e" font-weight="700">步骤 1   数据准备与患者级隔离</text></g><g id="s-segmentation" data-role="stage"><rect x="4" y="198" width="664" height="204" rx="0" fill="#fbfdf8" stroke="#8b9e73" stroke-width="0.65" /><text x="13" y="214" font-family="Microsoft YaHei UI" font-size="12.2" text-anchor="start" fill="#20303e" font-weight="700">步骤 2   EchoNet 权重迁移与左室分割</text></g><g id="s-geometry" data-role="stage"><rect x="4" y="410" width="664" height="182" rx="0" fill="#f9fcff" stroke="#839db6" stroke-width="0.65" /><text x="13" y="426" font-family="Microsoft YaHei UI" font-size="12.2" text-anchor="start" fill="#20303e" font-weight="700">步骤 3   从预测掩膜到几何容积</text></g><g id="s-evaluation" data-role="stage"><rect x="4" y="600" width="417" height="222" rx="0" fill="#fffef7" stroke="#b7ad73" stroke-width="0.65" /><text x="13" y="616" font-family="Microsoft YaHei UI" font-size="12.2" text-anchor="start" fill="#20303e" font-weight="700">步骤 4   心功能参数与分层评价</text></g><g id="s-patch" data-role="stage"><rect x="429" y="600" width="239" height="222" rx="0" fill="#fdfaff" stroke="#a48cab" stroke-width="0.65" /><text x="438" y="616" font-family="Microsoft YaHei UI" font-size="12.2" text-anchor="start" fill="#20303e" font-weight="700">步骤 5   贴片连续监测扩展</text></g><g id="n-input" data-role="node"><rect x="15" y="86" width="189" height="88" rx="3" fill="#f7e5d7" stroke="#8c9ca3" stroke-width="0.65" /><text x="109.5" y="121.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">CAMUS 两切面序列</text><text x="109.5" y="133.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">专家 ED / ES 标注</text><text x="109.5" y="145.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">外部公开数据</text></g><g id="n-preprocess" data-role="node"><rect x="219" y="86" width="230" height="88" rx="3" fill="#f7e5d7" stroke="#8c9ca3" stroke-width="0.65" /><text x="334.0" y="121.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">处理后数据核验与坐标审计</text><text x="334.0" y="133.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">原标注、空间 / 时间标定</text><text x="334.0" y="145.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">正反坐标变换</text></g><g id="n-split" data-role="node"><rect x="464" y="86" width="193" height="88" rx="3" fill="#f7e5d7" stroke="#8c9ca3" stroke-width="0.65" /><text x="560.5" y="121.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">固定患者级划分</text><text x="560.5" y="133.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">训练 / 验证 / 测试互斥</text><text x="560.5" y="145.0" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">参数学习 / 选模 / 最终评价</text></g><g id="e-input-preprocess" data-role="edge"><path d="M 205 132 L 217 132" stroke="#20303e" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M 217.000 132.000 L 213.650 133.794 L 213.650 130.206 Z" stroke="#20303e" stroke-width="0.3" fill="#20303e" stroke-linejoin="round" stroke-linecap="round" /></g><g id="e-preprocess-split" data-role="edge"><path d="M 450 132 L 462 132" stroke="#20303e" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M 462.000 132.000 L 458.650 133.794 L 458.650 130.206 Z" stroke="#20303e" stroke-width="0.3" fill="#20303e" stroke-linejoin="round" stroke-linecap="round" /></g><g id="n-network" data-role="node"><rect x="15" y="235" width="642" height="65" rx="3" fill="#edf3e5" stroke="#8c9ca3" stroke-width="0.65" /><text x="336.0" y="264.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">EchoNet 初始化 → ResNet-50 → ASPP → 分割头 → 左室掩膜</text><text x="336.0" y="276.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">网络结构主视觉；使用张量、分支和真实验证帧</text></g><g id="n-supervised" data-role="node"><rect x="15" y="320" width="380" height="65" rx="3" fill="#edf3e5" stroke="#8c9ca3" stroke-width="0.65" /><text x="205.0" y="349.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">专家标签 → BCE；影像 → 网络 → BCE</text><text x="205.0" y="361.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">训练更新；验证选模与早停</text></g><g id="n-inference" data-role="node"><rect x="410" y="320" width="247" height="65" rx="3" fill="#edf3e5" stroke="#8c9ca3" stroke-width="0.65" /><text x="533.5" y="349.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">最佳权重逐帧推理</text><text x="533.5" y="361.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">固定阈值；恢复原图坐标</text></g><g id="e-selected-inference" data-role="edge"><path d="M 397 352 L 408 352" stroke="#20303e" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M 408.000 352.000 L 404.650 353.794 L 404.650 350.206 Z" stroke="#20303e" stroke-width="0.3" fill="#20303e" stroke-linejoin="round" stroke-linecap="round" /></g><g id="n-contour" data-role="node"><rect x="15" y="449" width="273" height="125" rx="3" fill="#e9eff7" stroke="#8c9ca3" stroke-width="0.65" /><text x="151.5" y="502.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">原坐标掩膜 → 轮廓清理</text><text x="151.5" y="514.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">PCA 候选点；面积 / 长轴 / 20 盘径</text><text x="151.5" y="526.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">图形化展示长轴与截面</text></g><g id="n-volumes" data-role="node"><rect x="303" y="449" width="354" height="125" rx="3" fill="#e9eff7" stroke="#8c9ca3" stroke-width="0.65" /><text x="480.0" y="502.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">单平面面积–长度 / 双平面 20 椭圆盘</text><text x="480.0" y="514.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">同患者、同 ED / ES 相位配对</text><text x="480.0" y="526.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">空间标定 → 绝对容积</text></g><g id="e-geometry-volume" data-role="edge"><path d="M 290 512 L 301 512" stroke="#20303e" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path d="M 301.000 512.000 L 297.650 513.794 L 297.650 510.206 Z" stroke="#20303e" stroke-width="0.3" fill="#20303e" stroke-linejoin="round" stroke-linecap="round" /></g><g id="n-function" data-role="node"><rect x="15" y="640" width="395" height="65" rx="3" fill="#fbf3d9" stroke="#8c9ca3" stroke-width="0.65" /><text x="212.5" y="669.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">EDV / ESV → SV / EF</text><text x="212.5" y="681.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">参数公式与共同尺度的 ED / ES 轮廓</text></g><g id="n-evaluation" data-role="node"><rect x="15" y="720" width="395" height="85" rx="3" fill="#fbf3d9" stroke="#8c9ca3" stroke-width="0.65" /><text x="212.5" y="753.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">分割一致性；同法轮廓参考；数据集报告 EF</text><text x="212.5" y="765.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">患者级误差 / 一致性 / 置信区间 / 覆盖率</text><text x="212.5" y="777.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">独立参考缺失：null + 原因</text></g><g id="n-conditional" data-role="node"><rect x="441" y="640" width="215" height="165" rx="3" fill="#f3eaf5" stroke="#8c9ca3" stroke-width="0.65" /><text x="548.5" y="701.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">贴片连续采集（待接入）</text><text x="548.5" y="713.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">空间 / 时间标定</text><text x="548.5" y="725.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">完整周期或有来源参考 HR</text><text x="548.5" y="737.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">跨设备验证与独立参考</text><text x="548.5" y="749.5" font-family="Microsoft YaHei UI" font-size="8.6" text-anchor="middle" fill="#20303e" font-weight="400">条件满足后评价 HR / CO</text></g><text x="12" y="840" font-family="Microsoft YaHei UI" font-size="7.8" text-anchor="start" fill="#20303e" font-weight="400">轮廓派生点为候选；半周期不拼接。HR / CO 需可靠时间与完整周期，或有来源的参考 HR。</text><text x="12" y="854" font-family="Microsoft YaHei UI" font-size="7.8" text-anchor="start" fill="#20303e" font-weight="400">CAMUS：Leclerc et al., 2019 · CC BY-NC-SA 4.0。贴片扩展待接入、待外部验证。</text><text x="12" y="868" font-family="Microsoft YaHei UI" font-size="7.8" text-anchor="start" fill="#20303e" font-weight="400">方法与研究计划示意稿 · 不表示已完成临床验证 · 灰度缩略图为已有验证影像的矢量描摹</text></svg>